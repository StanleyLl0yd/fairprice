name: Android OCR prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Obtain offline model for packaging
        run: bash tools/fetch-ocr-model.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fairprice-ocr-prototype-debug
          path: app/build/outputs/apk/debug/*.apk
